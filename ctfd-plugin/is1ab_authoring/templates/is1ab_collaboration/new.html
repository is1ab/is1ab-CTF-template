{% extends "is1ab_collaboration/layout.html" %}
{% block work_content %}
<h1>新增提案／工單</h1>
<p>先確認考點、人員與交期，再開始製作。提案不要填寫 flag 或完整官解。</p>
<form method="post">
  <input type="hidden" name="nonce" value="{{ nonce }}">
  <div class="form-group"><label for="title">提案名稱</label><input id="title" class="form-control" name="title" maxlength="255" required value="{{ request.form.get('title', '') }}"></div>
  <div class="form-row">
    <div class="form-group col-md-6"><label for="category">分類</label><select id="category" class="form-control" name="category">{% for c in categories %}<option {% if request.form.get('category') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div>
    <div class="form-group col-md-6"><label for="difficulty">難度</label><select id="difficulty" class="form-control" name="difficulty">{% for d in difficulties %}<option {% if request.form.get('difficulty') == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
  </div>
  <div class="form-group"><label for="goal">考點與目標</label><textarea id="goal" class="form-control" name="goal" rows="3" maxlength="4000" required>{{ request.form.get('goal', '') }}</textarea></div>
  <div class="form-group"><label for="resources">資源／交付方式／維護需求</label><textarea id="resources" class="form-control" name="resources" rows="3" maxlength="4000">{{ request.form.get('resources', '') }}</textarea></div>
  {% if is_pm %}
  <div class="form-group"><label for="author">出題人</label><select id="author" name="author_id" class="form-control" required><option value="">請選擇</option>{% for u in authors %}<option value="{{ u.id }}" {% if request.form.get('author_id') == u.id|string %}selected{% endif %}>{{ u.name }}</option>{% endfor %}</select></div>
  <fieldset class="form-group"><legend class="h6">指派驗題人（可稍後安排）</legend>
    <div class="d-flex flex-wrap" style="gap:1rem">{% for u in reviewers %}<label><input type="checkbox" name="reviewers" value="{{ u.id }}" {% if u.id|string in request.form.getlist('reviewers') %}checked{% endif %}> {{ u.name }}</label>{% endfor %}</div>
  </fieldset>
  {% else %}<p>出題人：{{ viewer.name }}。驗題人由 PM 指派。</p>{% endif %}
  <div class="form-row">
    <div class="form-group col-md-6"><label for="due">送審截止日期</label><input id="due" type="date" class="form-control" name="due_date" value="{{ request.form.get('due_date', '') }}"></div>
    <div class="form-group col-md-6"><label for="hours">預估製作工時（小時）</label><input id="hours" type="number" min="0" max="10000" step="0.5" class="form-control" name="estimated_hours" value="{{ request.form.get('estimated_hours', '') }}"></div>
  </div>
  <button type="submit" class="btn btn-primary">建立提案</button>
</form>
{% endblock %}
