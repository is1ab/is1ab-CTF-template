services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sqli_challenge
    ports:
      - "8080:8080"
    restart: unless-stopped

    # 資源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

    # 環境變數（從 .env 文件讀取，或使用預設值）
    # 部署時請創建 .env 文件並設定 FLAG=YOUR_FLAG
    env_file:
      - .env
    environment:
      - FLAG=${FLAG:-FLAG{placeholder_change_me}}

    # 健康檢查（用 python，映像沒有 curl；間隔短一點讓就緒判斷快）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/login').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
