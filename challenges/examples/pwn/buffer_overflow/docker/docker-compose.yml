version: '3.8'

services:
  pwn-chall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buffer_overflow_chall
    ports:
      - "9999:9999"
    restart: unless-stopped

    # 資源限制
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

    # 安全設定
    security_opt:
      - no-new-privileges:true
    read_only: true

    # 環境變數
    # Flag 一律由外部注入（instancer 或 .env），不可寫死在此檔案：
    # 寫死會違反「flag 只存在 private.yml」的原則，也讓動態 flag 失效
    environment:
      - FLAG=${FLAG:-FLAG{placeholder_change_me}}

    # 健康檢查
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9999"]
      interval: 30s
      timeout: 10s
      retries: 3
